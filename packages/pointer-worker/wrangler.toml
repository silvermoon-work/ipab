# Scope / Variable service deployed as a Cloudflare Worker.
#
# One Durable Object per Scope; old class names remain only for migration history.
name = "ipab-pointer"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

# Replace this block with your own zone route when deploying to a custom domain.
# [[routes]]
# pattern = "pointers.example.com/*"
# zone_name = "example.com"

[[durable_objects.bindings]]
name = "POINTER"
class_name = "PointerObject"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "RegistryObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PointerObject", "RegistryObject"]

[[durable_objects.bindings]]
name = "SCOPE"
class_name = "ScopeObject"

[[durable_objects.bindings]]
name = "SCOPE_REGISTRY"
class_name = "ScopeRegistry"

[[migrations]]
tag = "scope-v1"
new_sqlite_classes = ["ScopeObject", "ScopeRegistry"]

[vars]
# Set the exact canonical HTTPS origin deployed by the operator.
# For local development use .dev.vars with http://127.0.0.1:8787.
POINTER_SERVICE = ""
# POINTER_API_KEY_SHA256 is a Wrangler secret, not a committed plaintext key.
# Only set when a browser client from another origin must call the API.
ALLOWED_ORIGIN = ""

[observability]
enabled = true

[observability.traces]
enabled = true
