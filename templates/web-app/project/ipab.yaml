entry: app.cjs
resources:
  - web
supportedSchemas: []
build:
  # Include the source Bundle DAG in app.car; disable to ship without source.
  # CLI --with-source / --without-source overrides this default.
  includeSource: true
  strategy: ipab-prebuild
  typecheck:
    - config: tsconfig.server.json
      entry: src/server/main.ts
    - config: tsconfig.web.json
      entry: src/web/main.ts
app: {}
