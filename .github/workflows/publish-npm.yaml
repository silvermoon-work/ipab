name: Publish npm package
on:
  push:
    tags:
      - "@ipab/cli@*"
      - "@ipab/bundle@*"
      - "@ipab/bundle-builder@*"
      - "@ipab/ipfs-store@*"
      - "@ipab/web-app@*"
  workflow_dispatch:
    inputs:
      package:
        description: One package to validate (dry-run only)
        required: true
        type: choice
        options:
          - "@ipab/ipfs-store"
          - "@ipab/bundle"
          - "@ipab/bundle-builder"
          - "@ipab/web-app"
          - "@ipab/cli"
      version:
        description: Exact version matching package.json
        required: true
        type: string
      sha:
        description: Exact main SHA matching this dispatch
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  publish:
    name: Verify and publish one package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Verify exact release evidence and publish selected package
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PACKAGE: ${{ inputs.package }}
          TARGET_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: pnpm publish-npm
