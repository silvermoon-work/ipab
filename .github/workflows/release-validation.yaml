name: Release validation
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact main commit SHA to validate (dry-run only)
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  evidence:
    name: Exact-SHA daily CI evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          test "$DISPATCH_REF" = refs/heads/main
          if [ "$TARGET_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Validate the exact main SHA selected by this dispatch; workflow head_sha must match."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Verify existing exact-SHA main-push CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
        run: node scripts/verify-ci.mjs
  full:
    name: Full release / ${{ matrix.name }}
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            node-version-file: .node-version
          - name: Node.js 22.15.0
            node-version: 22.15.0
          - name: Node.js 24.11.1
            node-version: 24.11.1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-release
  release-verification:
    name: Release verification (v2)
    needs: [evidence, full]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm exact-SHA evidence and every full matrix succeeded
        env:
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          FULL_RESULT: ${{ needs.full.result }}
        run: |
          if [ "$EVIDENCE_RESULT" != success ] || [ "$FULL_RESULT" != success ]; then
            echo "::error::Existing exact-SHA daily CI and every full release check must succeed."
            exit 1
          fi
