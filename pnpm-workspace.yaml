packages:
  - apps/*
  - packages/*

engineStrict: true
saveExact: false
strictPeerDependencies: true

allowBuilds:
  esbuild: true

catalog:
  "@eslint/js": 10.0.1
  "@types/node": 26.6.6
  "@vitest/coverage-v8": 5.1.0
  eslint: 10.15.0
  globals: 17.14.0
  prettier: 3.10.1
  publint: 0.3.25
  rimraf: 6.1.4
  turbo: 2.11.11
  typescript: 6.0.3
  typescript-eslint: 8.72.2
  vitest: 5.1.0

minimumReleaseAgeExclude:
  - "@eslint/config-array@0.23.6"
  - eslint@10.15.0
