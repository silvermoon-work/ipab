name: Publish npm package
on:
  push:
    tags:
      - "@ipab/cli@*"
      - "@ipab/bundle@*"
      - "@ipab/bundle-builder@*"
      - "@ipab/ipfs-store@*"
      - "@ipab/web-app@*"
  workflow_dispatch:
    inputs:
      package:
        description: One package to validate (dry-run only)
        required: true
        type: choice
        options:
          - "@ipab/ipfs-store"
          - "@ipab/bundle"
          - "@ipab/bundle-builder"
          - "@ipab/web-app"
          - "@ipab/cli"
      version:
        description: Exact version matching package.json
        required: true
        type: string
      sha:
        description: Exact main SHA matching this dispatch
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: npm-publication
  cancel-in-progress: false
jobs:
  publish:
    name: Verify and publish one package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Select one declared package
        id: target
        env:
          PACKAGE_INPUT: ${{ inputs.package }}
          TARGET_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
          fi
          target="$(pnpm exec publish-gate target --json)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$(printf '%s' "$target" | jq -r .version)" = "$TARGET_VERSION"
          fi
          printf '%s' "$target" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_OUTPUT"
      - name: Build and lint selected package
        env:
          TARGET_PACKAGE: ${{ steps.target.outputs.name }}
        run: pnpm exec turbo run lint-package --filter="$TARGET_PACKAGE"
      - name: Publish through the installed lifecycle gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_INPUT: ${{ steps.target.outputs.name }}
          PACKAGE_DIR: ${{ steps.target.outputs.directory }}
          PNPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          PNPM_CONFIG_ACCESS: public
          PNPM_CONFIG_TAG: ${{ steps.target.outputs.channel }}
          PNPM_CONFIG_PROVENANCE: "true"
          PNPM_CONFIG_DRY_RUN:
            ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: pnpm --dir "$PACKAGE_DIR" publish --no-git-checks
